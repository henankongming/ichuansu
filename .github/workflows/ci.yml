name: Go CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
      - name: unit tests
        run: go test -race ./...
      - name: go vet
        run: go vet ./...
      - name: linux amd64 build
        run: GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/ichuansu-linux .
      - name: windows amd64 build
        run: GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/_ichuansu.exe .
